<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box
        {
            height: 40px;
            WIDTH: 200px;
            background-color: aliceblue;
            position: absolute;
            top: 0px;
            left: 0px;
            animation-name:moveBox ;
            animation-duration: 2s;
            animation-delay:2s ;
            animation-iteration-count:4 ;

        }
        @keyframes moveBox{
            from{
                left: 0px;
            }
            to{
                left: 1200px;
            }
        }
    </style>
</head>
<body>
    <div class="box">
        <h3>This is animation</h3>
    </div>
</body>
</html>
