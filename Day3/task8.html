<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #outer
        {
            height: 600px;
            width: 600px;

        }

        #left
        {
            height: 600px;
            width: 100px;
            background-color: rgb(230, 21, 21);
            float: left;
        }

        #right
        {
            height: 600px;
            width: 500px;
            background-color: rgb(27, 25, 25);
            float: left;
        }

        #top
        {
            height: 100px;
            width: 500px;
            background-color: rgb(21, 24, 230);
        }

        #bottom
        {
            height: 500px;
            width: 500px;
            background-color: rgb(197, 185, 185);
            float: left;
        }

        #lft
        {
            height: 500px;
            width: 100px;
            background-color: rgb(56, 230, 21);
            float: left;
        }

        #rgt
        {
            height: 500px;
            width: 400px;
            background-color: rgb(221, 182, 10);
            float: left;
        }

        #rtop
        {
            height: 100px;
            width: 400px;
            background-color: rgb(39, 171, 211);
        }

        #rbottom
        {
            height: 400px;
            width: 400px;
            background-color: rgb(27, 25, 25);
        }

        #a
        {
            height: 400px;
            width: 100px;
            background-color: rgb(230, 21, 21);
            float: left;
        }

        #b
        {
            height: 400px;
            width: 300px;
            background-color: rgb(27, 25, 25);
            float: left;
        }

        #tp
        {
            height: 100px;
            width: 300px;
            background-color: rgb(174, 230, 21);
        }

        #btm
        {
            height: 300px;
            width: 300px;
            background-color: rgb(27, 25, 25);
        }

        #l
        {
            height: 300px;
            width: 100px;
            background-color: rgb(31, 29, 29);
            float: left;
        }

        #r
        {
            height: 300px;
            width: 200px;
            background-color: rgb(252, 11, 11);
            float: left;
        }

        #up
        {
            height: 150px;
            width: 200px;
            background-color: rgb(230, 21, 21);
        }

        #down
        {
            height: 150px;
            width: 200px;
            background-color: rgb(43, 43, 192);
        }
    </style>
</head>
<body>
    <div id="outer">
        <div id="left"></div>
        <div id="right">
            <div id="top"></div>
            <div id="bottom">
                <div id="lft"></div>
                <div id="rgt">
                    <div id="rtop"></div>
                    <div id="rbottom">
                        <div id="a"></div>
                        <div id="b">
                            <div id="tp"></div>
                            <div id="btm">
                                <div id="l"></div>
                                <div id="r">
                                    <div id="up"></div>
                                    <div id="down"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
