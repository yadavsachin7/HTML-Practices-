<!DOCTYPE html>
<html lang="en">
<head>

    <title>side menu</title>
    <style>
        body{
            background-color: rgb(176, 240, 181);
        }
        
        #menu
        {

        ul li{

            text-decoration: none;
        }

</head>
<body>

            <ul>

</html>
