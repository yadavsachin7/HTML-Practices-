<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body
        {
        }

        .outer
        {
            min-height: 350px;
            width: 820px;
            margin: 100px auto;
            padding: 80px;
            background: linear-gradient(300deg,rgba(107, 234, 34, 0.8),rgba(234,34,65,.8),rgba(64, 34, 234, 0.8),rgba(154, 34, 234, 0.8));
        }
        .inner
        {
            min-height: 300px;
            width: 800px;
            background-color: rgb(145, 175, 238);
            padding: 10px ;
        }
        .login
        {
            min-height: 250px;
            width: 500px;
            margin:50px auto ;
            background-color: white;
        }
        .i
        {
            height: 50px;
            width: 90%;
            border-radius: 5px;
            background-color: rgb(211, 230, 247);
            border: none;
            padding: 10px;
            margin: 20px;
            font-size: 25px;


        }
        .btn
        {
            height: 50px;
            width: 94%;
            background-color: blueviolet;
            padding: 10px;
            margin: 20px;
            font-size: 25px;
            color: white;
        }
    </style>
</head>
<body>
        <div class="outer">
            <div class="inner">
                <div class="login">
                    <h1 style="text-align: center;">Login To Your Account</h1><br>
                    <input type="text" class="i" placeholder="Username"> <br>
                    <input type="password" class="i" placeholder="Password" ><br>
                    <button class="btn">Login</button>
                </div>
            </div>
        </div>

</body>
</html>
