<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer
        {
            height: 400px;
            width: 270px;
            background-color: black;
            border-radius: 5%;
            padding: 20px;
            text-align: center;
            line-height: 50px;

        }
        .row
        {
            height: 50px;
            width: 250px;
            margin: 7px;
        }
        .key
        {
            height: 50px;
            width: 50px;
            margin: 5px;
            float: left;
            background-color: rgb(192, 198, 204);
        }

    </style>
</head>
<body>
    <div class="outer">
        <div class="row" style="background-color:rgb(192, 198, 204); margin-top:25px; width: 240px;"  ></div>
        <div class="row">
            <div class="key">7</div>
            <div class="key">8</div>
            <div class="key">9</div>
            <div class="key">/</div>
        </div>
        <div class="row">
            <div class="key">4</div>
            <div class="key">5</div>
            <div class="key">6</div>
            <div class="key">*</div>
        </div>
        <div class="row">
            <div class="key">1</div>
            <div class="key">2</div>
            <div class="key">3</div>
            <div class="key">-</div>
        </div>
        <div class="row">
            <div class="key">.</div>
            <div class="key">0</div>
            <div class="key">+</div>
            <div class="key" style="background-color: red; color: white;">C</div>
        </div>
        <div class="row" style="background-color: red; margin-top:25px; width: 235px;color: white;">=</div>
    </div>
</body>
</html>
