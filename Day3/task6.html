<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #outer
        {
            height: 900px;
            width: 600px;
        }

        #header   
        {
            height: 50px;
            width: 600px;
            background-color: blue;
        }

        #menu
        {
            height: 100px;
            width: 600px;
            background-color: chartreuse;
        }
        #img
        {
            height: 150px;
            width: 600px;
            background-color:gold;
        }
        #i1,#i5
        {
            height: 150px;
            width: 75px;
            background-color: rgb(15, 26, 4);
            float: left;
        }

        #i2,#i4
        {
            height: 150px;
            width: 150px;
            background-color: rgb(31, 43, 146);
            float: left;
        }
        #i3
        {
            height: 150px;
            width: 150px;
            background-color: rgb(189, 48, 135);
            float: left;
        }
        #about
        {
            height: 200px;
            width: 600px;
            background-color: rgb(216, 80, 16);
        }

        
        #news
        {
            height: 200px;
            width: 600px;
        }

        #left,#right
        {
            height: 200px;
            width: 100px;
            background-color: rgb(15, 26, 4);
            float: left;
        }

        #center
        {
            height: 200px;
            width: 400px;
            background-color: rgb(249, 253, 24);
            float: left;
        }

        #c1
        {
            height: 50px;
            width: 400px;
            background-color: rgb(133, 252, 14);
        }
        #c2,#c3
        {
            height: 75px;
            width: 400px;
            background-color: rgb(39, 22, 187);
        }

        #c21,#c32
        {
            height: 75px;
            width: 200px;
            background-color: rgb(253, 40, 40);
            float: left;
        }

        #c22,#c31
        {
            height: 75px;
            width: 200px;
            background-color: rgb(104, 33, 238);
            float: left;
        }
        #galary
        {
            height: 150px;
            width: 600px;
            background-color: rgb(15, 26, 4);
        }
        #g1,#g3
        {
            height: 150px;
            width: 200px;
            background-color: rgb(245, 230, 23);
            float: left;
        }

        #g2
        {
            height: 150px;
            width: 200px;
            background-color: rgb(122, 235, 10);
            float: left;
        }

        #footer
        {
            height: 50px;
            width: 600px;
            background-color: rgb(25, 26, 24);
        }



    </style>
</head>
<body>
    <div id="outer" >
        <div id="header"></div>
        <div id="menu"></div>
        <div id="img">
            <div id="i1"></div>
            <div id="i2"></div>
            <div id="i3"></div>
            <div id="i4"></div>
            <div id="i5"></div>
        </div>
        <div id="about"></div>
        <div id="news">
            <div id="left"></div>
            <div id="center">
                <div id="c1"></div>
                <div id="c2">
                    <div id="c21"></div>
                    <div id="c22"></div>
                </div>
                <div id="c3">
                    <div id="c31"></div>
                    <div id="c32"></div>                    
                </div>
            </div>
            <div id="right"></div>
        </div>
        <div id="galary">
                    <div id="g1"></div>
                    <div id="g2"></div>
                    <div id="g3"></div>
        </div>
        <div id="footer"></div>
    </div>
</body>
</html>
