<!DOCTYPE html>

    <style>

body{
    background-color: black;
}

#navbar{

    height: 100px;
    width: 1200px;
    background-color: rgb(255, 0, 157);
    padding-top: 10px;
}

.nav-box{

    height: 30px;
    width: 90px;
    float: left;
    margin-left: 30px;
    text-align: center;
    line-height: 30px;
    margin-top: 25px;

    position: relative;
}

.nav-box a{

    text-decoration: none;
    color: white;
}

.nav-box ul{

    position: absolute;
    top: 30px;
    left: 0px;

    width: 150px;

    padding: 0px;
    margin: 0px;

    opacity: 0;
}

.nav-box:hover > ul{

    opacity: 1;
}

.nav-box ul li{

    list-style-type: none;

    width: 150px;
    height: 30px;

    background-color: rgb(218, 241, 9);

    border: 2px solid black;

    line-height: 30px;

    position: relative;
}

.nav-box ul li ul{

    position: absolute;

    top: 0px;
    left: 150px;

    opacity: 0;
}

.nav-box ul li:hover > ul{

    opacity: 1;
}

    </style>
</head>

<body>
