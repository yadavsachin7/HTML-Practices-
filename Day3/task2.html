<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Document</title>

    <style>
        #outer
        {
            height: 200px;
            width: 600px;
        }

        #header
        {
            height: 50px;
            width: 600px;
            background-color: rgb(65, 59, 59);
        }
        #center
        {
            height: 100px;
            width: 600px;
        }

        #footer
        {
            height: 50px;
            width: 600px;
            background-color: rgb(119, 0, 255);
        }

        #a
        {
            height: 100px;
            width: 200px;
            background-color: red;
            float: left;
        }

        #b
        {
            height: 100px;
            width: 200px;
            background-color: rgb(0, 255, 76);
            float: left;
        }
        #c
        {
            height: 100px;
            width: 200px;
            background-color: rgb(233, 19, 19);
            float: left;
        }
        
        
        
        
    </style>
</head>
<body>

    <center>
        <h2>USE of Div tag </h2>
    </center>
    
    <div id="outer">
        <div id="header"></div>
        <div id="center">
            <div id="a"></div>
            <div id="b"></div>
            <div id="c"></div>
        </div>
        <div id="footer"></div>
    </div>
</body>
</html>
