<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>

    <style>
        .o{
            height: 550px;
            width: 500px;
            background-color:black;
            margin: 100px;
             padding-top: 5px;
             border-radius: 20px;
            
        }
        .row1{
            height: 100px;
            width: 400px;
            background-color: skyblue;
            margin-top: 10px;
            margin: 20px auto;
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
            line-height: 100px;
            color: white;
            font-size: 40px;
            
        }
        .row2{
             height: 300px;
            width: 380px;
           
            margin: 5px auto;
        }
        .row14{
            
            height: 60px;
            width: 380px;
            margin: 12px;
            
        }
        .a{
            margin: 2px;
            height: 60px;
            width: 85px;
            background-color: white;
            float: left;
            border-radius: 10%;
            text-align: center;
            line-height: 60px;
            color: black;
            font-size: 30px;
        }
        .d{
             margin: 2px;
            height: 60px;
            width: 85px;
            background-color: orange;
            float: left;
            border-radius: 100%;
            text-align: center;
            line-height: 60px;
            color: black;
            font-size: 30px;
        }
        
    </style>
</head>
<body>
        <div class="o">
            <div class="row1"> Welcome to calculator</div>
            <div class="row2">
                <div class="row14">
                     <div class="d">AC</div>
                    <div class="d">0</div>
                    <div class="d">%</div>
                    <div class="d">set</div>
                </div>
                <div class="row14">
                    <div class="a">7</div>
                    <div class="a">8</div>
                    <div class="a">9</div>
                    <div class="d">*</div>
                </div>
                <div class="row14">
                     <div class="a">4</div>
                    <div class="a">5</div>
                    <div class="a">6
                    </div>
                    <div class="d">-</div>
                </div>
                <div class="row14">
                     <div class="a">1</div>
                    <div class="a">2</div>
                    <div class="a">3</div>
                    <div class="d">+</div>
                </div>
                
                <div class="row14">
                     <div class="a">0</div>
                    <div class="a">00</div>
                    <div class="a">.</div>
                    <div class="d">=</div>
                </div>
            </div>
            
        </div>
</body>
</html>
