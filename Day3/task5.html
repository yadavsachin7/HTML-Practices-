<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #outer
        {
            height: 800px;
            width: 800px;
        }

        #left,#right
        {
            height: 800px;
            width: 50px;
            background-color: blueviolet;
            float: left;
        }

        #center
        {
            height: 800px;
            width: 700px;
            background-color: aqua;
            float: left;
        }

        #header
        {
            height: 50px;
            width: 700px;
            background-color: rgb(19, 1, 36);
        }
        
        #menu
        {
            height: 100px;
            width: 700px;
            background-color: rgb(226, 43, 43);

        }

        #about
        {
            height: 500px;
            width: 700px;
            background-color: rgb(31, 201, 62);
        }

        #img
        {
            height: 100px;
            width: 700px;
            background-color: rgb(226, 43, 43);

        }
        #footer
        {
            height: 50px;
            width: 700px;
            background-color: rgb(43, 46, 226);

        }

        #h1,#h3
        {
            height: 50px;
            width: 200px;
            background-color: aqua;
            float: left;
        }

        #h2
        {
            height: 50px;
            width: 300px;
            background-color: rgb(1, 39, 39);
            float: left;
        }
        
        #a1
        {
            height: 500px;
            width: 450px;
            background-color: aqua;
            float: left;
        }

        #a2
        {
            height: 500px;
            width: 250px;
            background-color:wheat;
            float: left;
        }

        #i1,#i3
        {
            height: 100px;
            width: 175px;
            background-color:rgb(245, 73, 110);
            float: left;
        }#i2,#i4
        {
            height: 100px;
            width: 175px;
            background-color:rgb(204, 179, 245);
            float: left;
        }
    </style>

</head>
<body>
    <div id="outer">
        <div id="left"></div>
        <div id="center">
            <div id="header">
                <div id="h1"></div>
                <div id="h2"></div>
                <div id="h3"></div>
            </div>
            <div id="menu"></div>
            <div id="about">
                <div id="a1"></div>
                <div id="a2"></div>
            </div>
            <div id="img">
                <div id="i1"></div>
                <div id="i2"></div>
                <div id="i3"></div>
                <div id="i4"></div>
            </div>
            <div id="footer"></div>
        </div>
        <div id="right"></div>
    </div>
</body>
</html>
