<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer
        {
            min-height: 600px;
            width: 800px;
            padding: 100px;
            margin:  80px auto;
            background-color: rgb(127, 127, 163);
            
        }
        .inner
        {
            min-height: 500px;
            width: 800px;

        }
        .a
        {
            min-height: 70px;
            width: 350px;
            float: left;
            background-color: white;
            text-align: center;
            font-size: 40px;
            line-height: 70px;
            margin-top:250px ;
            margin-right:  50px;


        }

        .b
        {
            min-height: 600px;
            width: 400px;
            float: left;
            background-color: rgb(77, 165, 42);
        }

         .i
        {
            height: 40px;
            width: 85%;
            border-radius: 5px;
            background-color: rgb(211, 230, 247);
            border: none;
            padding: 10px;
            margin: 20px;
            font-size: 25px;
        }

         .t
        {
            height: 100px;
            width: 85%;
            border-radius: 5px;
            background-color: rgb(211, 230, 247);
            border: none;
            padding: 10px;
            margin: 20px;
            font-size: 25px;
        }
        .btn
        {
            height: 50px;
            width: 90%;
            background-color: blueviolet;
            padding: 10px;
            margin: 20px;
            font-size: 25px;
            color:white;
            border-radius: 20px;
        }

        p
        {
            text-align:justify; 
            margin: 20px 50px; 
            font-size: 25px;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">
            <div class="a">Contact Form</div>            
            <div class="b">
                <h1 style="margin-left: 60px;">CONTACT FORM</h1>
                <input class="i" type="text" placeholder="Enter Name"><br>
                <input  class="i" type="email" placeholder="Enter Email"><br>
                <input class="t" type="textarea"><br>
                <button class="btn">Submit</button>
                <p >Forgot Password!</p>
            </div>
        </div>
    </div>
</body>
</html>
