<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #outer
        {
            height:600px;
            width: 600px;
            background-color: aquamarine;
        }
        #left,#right
        {
            height: 600px;
            width: 50px;
            background-color: black;
            float: left;
        }

        #center
        {
            height: 600px;
            width: 500px;
            background-color: rgb(230, 21, 21);
            float: left;
        }
        #top,#bottom
        {
            height: 50px;
            width: 500px;
            background-color: rgb(224, 34, 177);
        }
        #mid
        {
            height: 500px;
            width: 500px;
            background-color: rgb(60, 18, 209);
        }

        #m1,#m4
        {
            height: 500px;
            width: 50px;
            background-color: rgb(104, 34, 17);
            float: left;
        }

        #m2,#m3
        {
            height: 500px;
            width: 200px;
            background-color: rgb(177, 24, 108);
            float: left;
        }

        #x1,#x4
        {
            height: 50px;
            width: 200px;
            background-color: rgb(47, 24, 177);
        }

        #x2,#y3
        {
            height: 200px;
            width: 200px;
            background-color: rgb(240, 20, 20);
        }
        #x3,#y2
        {
            height: 200px;
            width: 200px;
            background-color: rgb(191, 236, 27);
        }


        #y1,#y4
        {
            height: 50px;
            width: 200px;
            background-color: rgb(24, 24, 26);
        }

        /*
        #y2
        {
            height: 200px;
            width: 200px;
            background-color: rgb(32, 177, 19);
        }
        #y3
        {
            height: 200px;
            width: 200px;
            background-color: rgb(236, 27, 27);
        }
        */



    </style>
</head>
<body>
    
    <div id="outer">
        <div id="left"></div>
        <div id="center">
            <div id="top"></div>
            <div id="mid">
                <div id="m1"></div>
                <div id="m2">
                    <div id="x1"></div>
                    <div id="x2"></div>
                    <div id="x3"></div>
                    <div id="x4"></div>
                </div>
                <div id="m3">
                    <div id="y1"></div>
                    <div id="y2"></div>
                    <div id="y3"></div>
                    <div id="y4"></div>
                </div>
                <div id="m4"></div>
            </div>
            <div id="bottom"></div>
        </div>
        <div id="right"></div>
    </div>
</body>
</html>
