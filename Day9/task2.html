<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .circle
        {
            height: 100px;
            width: 100px;
            background-color: aqua;
            border-radius: 100%;
            position: absolute;
            top: 100px;
            left: 100px;
            animation-name: circl;
            animation-duration: 2s;
            animation-iteration-count: infinite;
        }
        @keyframes circl
        {
            from
            {
                top: 100px;
                left: 100px;
            }
            to
            {
                background-color: rgb(170, 228, 36);
                height: 150px;
                width: 150px;
                border-radius: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="circle"></div>
</body>
</html>
