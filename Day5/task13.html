<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer
        {
            min-height: 800px;
            width: 600px;
            margin: 80px auto;
            background: url(../image.png),
            rgba(102, 95, 95, 1);
            background-size:cover ;
            padding:100px;

        }
        .inner
        {
            min-height: 800px;
            width: 600px;
            background-color: rgb(122, 133, 143);
        }
         .i
        {
            height: 50px;
            width: 85%;
            border-radius: 5px;
            background-color: rgb(211, 230, 247);
            border: none;
            padding: 10px;
            margin: 20px;
            font-size: 25px;


        }
        .btn
        {
            height: 50px;
            width: 90%;
            background-color: blueviolet;
            padding: 10px;
            margin: 20px;
            font-size: 25px;
            color:white;
        }
        p
        {
            text-align:justify; 
            margin: 20px 50px; 
            font-size: 25px;
        }
        h4
        {
            margin-bottom:50px ;
        }
        .bt
        {
            height: 50px;
            width: 200px;
            border-radius: 10px;
            background-color:rgb(106, 230, 106);
            margin: 0px 45px;
            font-size: 20px;
            
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">
            <h1 style="text-align: center;">Login </h1><br>
                    <input type="email" class="i" placeholder="Email"> <br>
                    <input type="password" class="i" placeholder="Password" ><br>
                    <a href=""><p>Forgot Password!</p> </a>
                    <button class="btn">Login</button>
                    <p>Or Login With</p>
                    <button class="bt"><a href="https://www.facebook.com" target="_blank">facebook</a></button>
                    <button class="bt" style="background-color: rgb(223, 96, 96);"><a href="https://www.instagram.com" target="_blank">Instagram</a></button>
                    <p>Don't Have Account 
                        <a href="">Sign Up</a>
                    </p>
        </div>
    </div>
</body>
</html>
