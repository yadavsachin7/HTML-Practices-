<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: bisque;
            position: relative;
        }
        .box1
        {
            height: 100px;
            width: 100px;
            background-color: red;
            position: absolute;
            top: 0px;
            left: 0px;

        }
        .box2
        {
            height: 100px;
            width: 100px;
            background-color: rgb(25, 0, 255);
            position: absolute;
            top: 200px;
            left: 0px;
            /* Animation css */
            animation-name: box;
            animation-duration: 2s;
            animation-delay: 2s;
            animation-iteration-count: 3;
            
        }
        /* .box3
        {
            height: 100px;
            width: 100px;
            background-color: rgb(9, 255, 0);
            position: absolute;
            left: 0px;
            bottom: -600px;
            
        } */

        @keyframes box{
            0%
            {
                left:0px;
            }
            50%
            {
                right: 300px;
            }
            100%
            {
                right: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="box1">Box1</div>
    <div class="box2">Box2</div>
    <div class="box3">Box3</div>
</body>
</html>
