<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: aqua;
        }
        #sign_up
        {
            height: 380px;
            width: 420px;
            background-color: white;
            margin: 50px auto;
            padding: 15px;
            background-color:rgb(204, 250, 252);

        }
        .names
        {
            height: 70px;
            width: 430px;
        }
        #head
        {
            font-size: 23px;
            text-align: center;
        }
        .flname
        {
            height: 70px;
            width: 215px;
            float: left;
        }
        
        .i1
        {
            height: 30px;
            width: 200px;
            margin-top: 7px;

        }
        .i2
        {
            height: 30px;
            width: 415px;
            margin: 7px 0px;

        }
        #btn
        {
            height: 40px;
            width: 200px;
            background-color: rgb(25, 209, 148);
            border: none;
            border-radius: 2px;
            margin: 10px 100px;
            color: white;
        }
        #bottom
        {
            font-size: 18px;
            margin: 5px 110px;
        }
        

    </style>

</head>
<body>
    
    <form action="">
        <div id="sign_up">
        <p id="head">Sign Up</p>
        <div class="names">
            <div class="flname">
                <label  for="" >FIRST NAME</label><br>
                <input class="i1" type="text" required>

            </div>
            <div class="flname">
                <label for="">LAST NAME</label>
                <input class="i1" type="text" required>

            </div>
        </div>
        
        <label for=""> EMAIL</label> <br>
        <input class="i2" type="email" required><br>

        <label for=""> PASSWORD</label><br>
        <input class="i2" type="password" required><br>

        <button id="btn">CREATE ACCOUNT</button>
        <p id="bottom">Already have an account</p>
    </div>
    </form>

</body>
</html>
