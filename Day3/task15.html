<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #outer
        {
            height: 600px;
            width: 600px;
            text-align: center;
            color: aliceblue;
            line-height: 50px;

        }

        #header
        {
            height: 50px;
            width: 600px;
            background-color: rgb(241, 241, 24);
        }

        #title
        {
            height: 100px;
            width: 600px;
            background-color: rgb(66, 23, 223);
        }

        #logo
        {
            height: 100px;
            width: 200px;
            background-color: rgb(27, 27, 27);
            float: left;
        }

        #subtitle
        {
            height: 100px;
            width: 400px;
            background-color: rgb(224, 21, 21);
            float: left;
        }
        #menu
        {
            height: 50px;
            width: 600px;
            background-color: rgb(241, 241, 24);
        }

        #main
        {
            height: 250px;
            width: 600px;
            background-color: rgb(49, 39, 196);
        }

        #left
        {
            height: 250px;
            width: 450px;
            background-color: rgb(27, 27, 27);
            float: left;
        }
        #right
        {
            height: 250px;
            width: 150px;
            background-color: rgb(177, 202, 36);
            float: left;
        }
        #ufooter
        {
            height: 100px;
            width: 600px;
            background-color: rgb(45, 159, 212);
        }

        #a,#c
        {
            height: 100px;
            width: 170px;
            background-color: rgb(149, 248, 163);
            float: left;
        }
        #b
        {
            height: 100px;
            width: 260px;
            background-color: rgb(35, 38, 180);
            float: left;
        }

        #bfooter
        {
            height: 50px;
            width: 600px;
            background-color: rgb(45, 159, 212);
        }

        #f1
        {
            height: 50px;
            width: 300px;
            background-color: rgb(164, 149, 248);
            float: left;
        }
        #f2
        {
            height: 50px;
            width: 300px;
            background-color: rgb(180, 35, 66);
            float: left;
        }

        


    </style>
</head>
<body>
    <div id="outer">
        <div id="header">Top</div>
        <div id="title">
            <div id="logo">LOGO</div>
            <div id="subtitle">SubTitle</div>
        </div>
        <div id="menu">Menu</div>
        <div id="main">
            <div id="left"></div>
            <div id="right"></div>
        </div> 
        <div id="ufooter">
            <div id="a"></div>
            <div id="b"></div>
            <div id="c"></div>
        </div>
        <div id="bfooter">
            <div id="f1"></div>
            <div id="f2"></div>
        </div>
    </div>
</body>
</html>
