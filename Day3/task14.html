        #t

        }

        #dn

            height: 300px;

        }
        
        

        #d1
        {
            height: 300px;

        }

        #d2

            height: 300px;
            width: 50px;
            background-color: rgb(223, 113, 23);
            float: left;
        }

        #top

        #down

        #a

            height: 500px;

        }

        #b
        {
            height: 500px;
            width: 100px;

            float: left;
        }

        #c
        {
            height: 500px;
            width: 150px;
            background-color: rgb(238, 250, 73);
            float: left;
        }

        #d
        {
            height: 500px;
            width: 150px;
            background-color: rgb(223, 113, 23);
            float: left;
        }
        
        #a1
        {
            height: 150px;
            width: 100px;
            background-color: rgb(241, 241, 24);
        }

        #a2
        {
            height: 200px;
            width: 100px;
            background-color: rgb(66, 23, 223);
        }

        #a3

            height: 150px;

        }


        #b1

            height: 150px;
            width: 100px;
            background-color: rgb(57, 24, 241);

        #b2
        {
            height: 200px;
            width: 100px;
            background-color: rgb(223, 23, 33);

        #b3

        #cdown

        #cl

        #cr

            height: 400px;

        #dtop

            height: 300px;
            width: 100px;

        <div id="right">

            <div id="down">

                </div>
                <div id="d">

                    <div id="ddown">
                        <div id="dl"></div>
                        <div id="dr">
                            <div id="drtop"></div>
                            <div id="drdown">

                                <div id="dr_down_r"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
