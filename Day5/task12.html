<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer
        {
            min-height:600px;
            width: 800px;
            background:url(../image.png) ;
            margin: 80px auto;
            padding: 100px;
            background-size: cover;

        }
        .inner
        {
            min-height: 600px;
            width: 800px;

        }
        .inner1
        {
            height: 600px;
            width: 400px;
            background-color: aliceblue;
            text-align: center;
            color: white;
            font-size: 20px;
            float: left;
            background: url(../image1.png);
            background-size:cover;
            /*background: rgba(133,32,45,.5);*/
            
        }
        .inner2
        {
            height: 600px;
            width:400px;
            background-color:white;
            float: left;

        }
         .i
        {
            height: 50px;
            width: 85%;
            border-radius: 5px;
            background-color: rgb(211, 230, 247);
            border: none;
            padding: 10px;
            margin: 20px;
            font-size: 25px;


        }
        .btn
        {
            height: 50px;
            width: 90%;
            background-color: blueviolet;
            padding: 10px;
            margin: 20px;
            font-size: 25px;
            color: white;
        }
        p
        {
            text-align:justify; 
            margin: 20px 50px; 
            font-size: 25px;
        }
        h4
        {
            margin-bottom:50px ;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="inner">
            <div class="inner1">
                <h1 style="margin-top:250px;">Welcome Back</h1>
                <p >Please login using your 
                    personal information to stay connected
                with us </p>
            </div>
            <div class="inner2">
                <h1 style="text-align: center;">Login </h1><br>
                    <input type="email" class="i" placeholder="Email"> <br>
                    <input type="password" class="i" placeholder="Password" ><br>
                    <a href=""><p>Forgot Password!</p> </a>
                    <button class="btn">Login</button>
                    <p>Don't Have Account 
                        <a href="">Sign Up</a>
                    </p>
            </div>
        </div>
    </div>
</body>
</html>
