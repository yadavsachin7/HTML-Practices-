<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .heading
        {
            font-size: 30px;
                letter-spacing: 5px;
                animation-name:head ;
                animation-duration: 2s;
                animation-iteration-count: infinite;
        }
        @keyframes head
        {
            from
            {
                font-size: 30px;
                letter-spacing: 5px;
            }
            to
            {
                font-size: 50px;
                letter-spacing: 15px;
                color: blueviolet;
            }
        }
    </style>
</head>
<body>
    <h1 class="heading">This is Animation</h1>
</body>
</html>
