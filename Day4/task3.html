<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #outer
        {
            height: 800px;
            width: 1000px;
            padding: 50px;
            box-sizing: border-box;
            background-color: rgb(221, 199, 243);

        }
        .left
        {
            height: 700px;
            width: 300px;
            background-color: aquamarine;
            float: left;
            padding: 50px;
            box-sizing: border-box;
        }


        .l1
        {
            height: 600px;
            width: 200px;
            background-color: rgb(161, 127, 255);
            padding: 50px;
            box-sizing: border-box;
        }

        .l2
        {
            height: 500px;
            width: 100px;
            background-color: rgb(168, 255, 127);
        }

        .right
        {
            height: 700px;
            width: 500px;
            background-color: rgb(187, 157, 129);
            float: left;
            padding: 50px;
            box-sizing: border-box;
            margin-left: 50px;
        }

        .r1
        {
            height: 600px;
            width: 400px;
            background-color: rgb(161, 127, 255);
            padding: 50px;
            box-sizing: border-box;
        }

        .r2
        {
            height: 500px;
            width: 300px;
            background-color: rgb(180, 226, 52);
            padding: 50px;
            box-sizing: border-box;
        }
        
        .r3
        {
            height: 400px;
            width: 200px;
            background-color: rgb(161, 127, 255);
            padding: 50px;
            box-sizing: border-box;
        }

        .r4
        {
            height: 300px;
            width: 100px;
            background-color: rgb(226, 73, 157);
        }

    </style>
</head>
<body>
    <div id="outer">
        <div class="left">
            <div class="l1">
                <div class="l2"></div>
            </div>
        </div> 
        <div class="right">
            <div class="r1">
                <div class="r2">
                    <div class="r3">
                        <div class="r4"></div>

                    </div>
                </div>
            </div>
        </div> 
    </div>
</body>
</html>
