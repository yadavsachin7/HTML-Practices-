<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #outer

            height: 1000px;
            width: 800px;

        }

        }

        /* **********Head CSS *************** */
        #h1
        {

        }
        #h2

            height: 200px;

            float: left;
            
        }
        #h4

            height: 200px;
            width: 30px;
            float: left;
            
        }
        #h5
        {
            height: 200px;
            width: 220px;
            float: left;
            
        }
        /* left Ear CSS  ***************/

        #h21,#h23,#h41,#h43

            height: 40px;

        }
        #h22,#h42

        #h31,#h33

        }
        #h32

            height: 40px;

           /* background-color: aquamarine;*/
        }

        #eye0,#eye3

            height: 40px;
            width: 40px;
            float: left;

        }
        #eye1,#eye2
        {
            height: 40px;
            width: 100px;
            background-color: rgb(43, 25, 204);
            float: left;
        }
        #eye_g
        {
            height: 40px;
            width: 20px;
            float: left;
        }

        /* *********** CSS OF MOUTH *************/

        #mouth_l,#mouth_r
        {
            height: 40px;
            width: 75px;
            float: left;
        
        }
        #mouth{
            height: 40px;
            width: 150px;
            float: left;
            background-color: rgb(255, 81, 0);

        }
        /* ***************CSS OF Throat *******************/

        #throat_l
        {
            height: 30px;
            width: 360px;
            float: left;

        }

        #throat_m
        {
            height: 30px;
            width: 80px;
            background-color: blueviolet;
            float: left;
        }
        #throat_r
        {
            height: 30px;
            width: 360px;
           float: left;

        }

        #stomuch_l,#stomuch_r

            height: 570px;
            width: 150px;
            float: left;
        }

        #stomuch_m
        {
            height: 570px;
            width: 500px;
            float: left;
            background-color:papayawhip;
        }

        #hand_lg,#hand_rg
        {
            height: 50px;
            width: 150px;
        }

        #hand_l,#hand_r
        {
            height: 50px;
            width: 150px;
            background-color: rgb(248, 153, 76);
        }
        /* ****************CSS OF stomuch boxes and gap * */
        #stomuch_gap_l,#stomuch_gap_r
        {
            height: 570px;
            width: 225px;
            float: left;
        }

        #stomuch_box
        {
            height: 570px;
            width: 50px;
            float: left;
        }

        /* main stomuch box and gap */

        #gap1,#gap5
        {
            height: 90px;
            width: 50px;
        }

        #box1,#box2,#box3,#box4
        {
            height: 50px;
            width: 50px;
            background-color: rgb(238, 202, 40);
        }
        #gap2,#gap3,#gap4
        {
            height: 40px;
            width: 50px;
        }

        /* ************ Leg Css ***/
        #leg_gap1,leg_gap3
        {
            height: 200px;
            width: 275px;
            float: left;
        }
        #leg_gap2
        {
            height: 200px;
            width: 150px;
            float: left;
        }

        #leg1,#leg2
        {
            height: 200px;
            width: 50px;
            float: left;
            background-color: rgb(233, 176, 101);

</style>

        </div>

                    <div id="gap3"></div>

                    <div id="gap4"></div>
                    <div id="box4"></div>
                    <div id="gap5"></div>
                    
                </div>
                <div id="stomuch_gap_r"></div>
                
            </div>
            <div id="stomuch_r">

            </div>
        </div>
        <div id="leg">
            <div id="leg_gap1"></div>
            <div id="leg1"></div>
            <div id="leg_gap2"></div>
            <div id="leg2"></div>
            <div id="leg_gap3"></div>

    </center>
