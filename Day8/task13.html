<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task 13</title>
    <style>

        #box{
           
            height: 100px;
            width: 100px;

            position: absolute;

            animation-name: changing;
            animation-duration: 3s;
            /* animation-delay: 3s; */
            animation-iteration-count: infinite;
        }

        @keyframes changing {
            from{
                background-color: red;
            }
            to{
                background-color: blue;
            }
    
          
            
        }
    </style>
</head>
<body>
    <!-- Create a box whose background color changes automatically.  -->

    <div id="box"></div>
</body>
</html>
