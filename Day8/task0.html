<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer
        {
            height: 300px;
            width: 500px;
            background-color: aquamarine;
            position: relative;
        }
        .div1
        {
            height: 50px;
            width: 100px;
            background-color: rgb(127, 146, 255);
            position: absolute;
            top: 10px;
            left: 10px;
        }
        .div2
        {
            height: 50px;
            width: 200px;
            background-color: rgb(255, 127, 197);
            position: absolute;
            top: 10px;
            left: 150px;
        }
        .div3
        {
            height: 50px;
            width: 100px;
            background-color: rgb(127, 146, 255);
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .div4
        {
            height: 50px;
            width: 100px;
            background-color: rgb(255, 204, 127);
            position: absolute;
            top: 120px;
            left: 200px;
        }
        .div5
        {
            height: 50px;
            width: 100px;
            background-color: rgb(127, 146, 255);
            position: absolute;
            bottom: 10px;
            left: 10px;
        }
        .div6
        {
            height: 50px;
            width: 200px;
            background-color: rgb(127, 255, 138);
            position: absolute;
            bottom: 10px;
            left: 150px;
        }
        .div7
        {
            height: 50px;
            width: 100px;
            background-color: rgb(127, 146, 255);
            position: absolute;
            bottom: 10px;
            right: 10px;
        }
    </style>
    
</head>
<body>
    <div class="outer">
        <div class="div1"></div>
        <div class="div2"></div>
        <div class="div3"></div>
        <div class="div4"></div>
        <div class="div5"></div>
        <div class="div6"></div>
        <div class="div7"></div>
    </div>
</body>
</html>
