<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #outer
        {
            height: 500px;
            width: 500px;
            text-align: center;
            color: azure;

        }

        #header
        {
            height: 100px;
            width: 500px;
            background-color: rgb(223, 23, 23);
            line-height: 100px;
        }

        #content
        {
            height: 350px;
            width: 500px;
            background-color: rgb(36, 29, 29);
            line-height: 350px;
        }
        #footer
        {
            height: 50px;
            width: 500px;
            background-color: rgb(223, 23, 23);
            line-height: 50px;
        }

        #logo
        {
            height: 100px;
            width: 100px;
            background-color: rgb(26, 23, 223);
            float: left;
        }

        #title
        {
            height: 100px;
            width: 400px;
            background-color: rgb(223, 23, 133);
            float: left;
        }

        #left
        {
            height: 350px;
            width: 350px;
            background-color: rgb(23, 223, 40);
            float: left;
        }

        #right
        {
            height: 350px;
            width: 150px;
            background-color: rgb(186, 223, 23);
            float: left;
        }

        #footer
        {
            height: 50px;
            width: 500px;
            background-color: rgb(23, 22, 24);
        }

    
    </style>
</head>
<body>
    <div id="outer">
        <div id="header">
            <div id="logo">Logo</div>
            <div id="title">SubTitle</div>
        </div>
        <div id="content">
            <div id="left">LEFT</div>
            <div id="right">Right</div>
        </div>
        <div id="footer">Footer</div>
    </div>
</body>
</html>
