<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #outer
        {
            height: 600px;
            width: 600px;
            
        }
        #a,#c
        {
            height: 600px;
            width: 100px;
            background-color: red;
            float: left;
        }

        #b
        {
            height: 600px;
            width: 400px;
            float: left;
        }
        

        #b1,#b3    
        {
            height: 150px;
            width: 400px;
            background-color: rgb(89, 0, 255);
        }

        #b2    
        {
            height: 300px;
            width: 400px;
        }

        #x
        {
            height: 300px;
            width: 200px;
            background-color: rgb(165, 64, 64);
            float: left;
        }

        #y
        {
            height: 300px;
            width: 200px;
            background-color: rgb(48, 47, 51);
            float: left;
        }
    </style>
</head>
<body>
    <div id="outer">
        <div id="a"></div>
        <div id="b">
            <div id="b1"></div>
            <div id="b2">
                <div id="x"></div>
                <div id="y"></div>
            </div>
            <div id="b3"></div>
        </div>
        <div id="c"></div>
    </div>
</body>
</html>
