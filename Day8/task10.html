<html>

<head>

    <style>
        body{

            background-color: royalblue;
            position: relative;
        }


        #square{

        height: 100px;
        width: 100px;
        background-color: rgb(34, 32, 32);
        border: 2px solid rgb(230, 11, 11);
        border-radius: 5px;
        
        position: absolute;
        animation-name: rotating-box ;
        animation-duration: 2s;
        animation-iteration-count: infinite;

        }


        @keyframes rotating-box{
            from{
                top: 100px;
                left: 0px;

                
            }
            to{
                right: 0px;
                top: 100px;

               

            }

        }
    </style>
</head>

<body>  

    <!-- Create a square that rotates continuously.  -->
        <div id="square"></div>


</body>
</html>
