<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #outer
        {
            height: 800px;
            width: 800px;

        }
        #contact
        {
            height: 50px;
            width: 800px;

        }
        #email
        {
            height: 50px;
            width: 200px;
            background-color: blueviolet;
            float: left;
        }
        #phone
        {
            height: 50px;
            width: 200px;
            background-color: rgb(27, 26, 27);
            float: left;
        }#mob
        {
            height: 50px;
            width: 200px;
            background-color: rgb(43, 55, 226);
            float: left;
        }
        #git
        {
            height: 50px;
            width: 200px;
            background-color: rgb(226, 43, 171);
            float: left;
        }

        #menu
        {
            height: 100px;
            width: 800px;
        }

        #logo
        {
            height: 100px;
            width: 200px;
            background-color: rgb(101, 9, 187);
            float: left;
        }
        #m_name
        {
            height: 100px;
            width: 600px;
            background-color: rgb(226, 43, 43);
            float: left;
        }

        #header        {
            height: 200px;
            width: 800px;
            background-color: rgb(61, 43, 226);
        }

        #news
        {
            height: 100px;
            width: 800px;
        }

        #a
        {
            height: 100px;
            width: 400px;
            background-color: rgb(43, 226, 67);
            float: left;
        }
        #b
        {
            height: 100px;
            width: 400px;
            background-color: rgb(29, 27, 27);
            float: left;
        }

        #galary
        {
            height: 300px;
            width: 800px;
            
        }

        #img1,#img3
        {
            height: 300px;
            width: 100px;
            background-color: rgb(226, 43, 43);
            float: left;
        }
        #img2
        {
            height: 300px;
            width: 600px;
            background-color: blueviolet;
            float: left;
        }
        #footer
        {
            height: 50px;
            width: 800px;
            background-color: rgb(30, 30, 31);
        }

    </style>
</head>
<body>

    <div id="outer">
        <div id="contact">
            <div id="email"></div>
            <div id="phone"></div>
            <div id="mob"></div>
            <div id="git"></div>
        </div>

        <div id="menu">
            <div id="logo"></div>
            <div id="m_name"></div>
        </div>

        <div id="header"></div>
        <div id="news">
            <div id="a"></div>
            <div id="b"></div>
        </div>
        <div id="galary">
            <div id="img1"></div>
            <div id="img2"></div>
            <div id="img3"></div>
        </div>
        <div id="footer"></div>

    </div>
    
</body>
</html>
