<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body
        {
            background-color: skyblue;
            position: relative;
        }
        .box1
        {
            height: 70px;
            width: 100px;
            background-color: blue;
            position: absolute;
            top: 0px;
            left: 10px;
        }
        .box2
        {
            height: 70px;
            width: 100px;
            background-color: rgb(9, 255, 0);
            position: absolute;
            top: 0px;
            left: 300px;
        }
        .box3
        {
            height: 70px;
            width: 100px;
            background-color: blue;
            position: absolute;
            top: 0px;
            left: 600px;
        }
        .box4
        {
            height: 70px;
            width: 100px;
            background-color: rgb(0, 174, 255);
            position: absolute;
            top: 0px;
            right: 300px;
        }
        .box5
        {
            height: 70px;
            width: 100px;
            background-color: blue;
            position: absolute;
            top: 0px;
            right: 50px;
        }
        
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
</body>
</html>
