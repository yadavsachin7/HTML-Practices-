<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>

    <style>
        .o{
            height: 700px; 
            width: 500px;
            background-color:rgb(127, 144, 201);
            margin: 100px auto;
             padding: 100px;
             border-radius: 20px;
            
        }
        .out
        {
            height: 80px;
            width: 500px;
            margin: 20px auto;
            background: white;
            line-height: 80px;
            text-align: center;
            font-size: 25px;


        }

        .cal
        {
            height: 600px;
            width: 500px;
            background-color: black;
            padding: 50px;
            box-sizing: border-box;
        }
        
        .row1{
            height: 100px;
            width: 400px;
            background-color: skyblue;
            margin-top: 100px;
            margin: 20px auto;
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
            line-height: 100px;
            color: white;
            font-size: 40px;
            
        }
        .row2{
             height: 300px;
            width: 380px;
           
            margin: 5px auto;
        }
        .row14{
            
            height: 60px;
            width: 380px;
            margin: 12px;
            
        }
        .a{
            margin: 2px;
            height: 60px;
            width: 85px;
            background-color: white;
            float: left;
            border-radius: 10%;
            text-align: center;
            line-height: 60px;
            color: black;
            font-size: 30px;
        }
        .d{
            width: 250px;
            text-align: center;
            line-height: 60px;
            font-size: 30px;
            background-color: white;
            border-radius: 10%;

        }
        
        
    </style>
</head>
<body>
        <div class="o">
            <div class="out">Html Calculator Code</div>

            <div class="cal">

                <div class="row1"> 1+1=2</div>
            <div class="row2">
                <div class="row14">
                     <div class="a">1</div>
                    <div class="a">2</div>
                    <div class="a">3</div>
                    <div class="a">%</div>
                </div>
                <div class="row14">
                    <div class="a">4</div>
                    <div class="a">5</div>
                    <div class="a">6</div>
                    <div class="a">*</div>
                </div>
                <div class="row14">
                     <div class="a">7</div>
                    <div class="a">8</div>
                    <div class="a">9
                    </div>
                    <div class="a">+</div>
                </div>
                <div class="row14">
                     <div class="a"">AC</div>
                     <div class="a"">0</div>
                    <div class="a">.</div>
                    <div class="a">=</div>
                </div>
                
                
            </div>

            </div>
            
        </div>
                    
</body>
</html>
